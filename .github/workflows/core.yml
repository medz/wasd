name: Core interpreter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.11.0', '3.13.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only archives are reused; the installer checks their pinned hashes
          # before extracting fresh binaries on this runner.
          path: .toolchains/.downloads/*.tar.gz
          key: toolchain-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/toolchain.lock.json') }}
      - run: tool/ensure_toolchains.sh
      - run: dart analyze
      - run: dart test test/wasm_core_features_test.dart
      - run: dart test test/wasm_host_globals_test.dart
      - run: dart run tool/core_multi_memory_public_runner.dart --output=build/core-multi-memory-public.json
      - run: dart test test/wasm_gc_element_globals_test.dart test/wasm_f64_const_test.dart test/wasm_f32_const_test.dart test/wasm_gc_v128_defaults_test.dart test/wasm_gc_array_test.dart test/wasm_async_tail_call_test.dart test/wasm_test.dart test/wasm_memory_test.dart test/wasm_table_test.dart test/wasm_predecode_test.dart test/wasi_preview3_async_runtime_test.dart test/wasi_preview3_task_return_runner_test.dart
      - run: dart run tool/spec_testsuite_runner.dart --suite=core --output-json=build/core.json --output-md=build/core.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-${{ matrix.sdk }}
          path: |
            build/core.*
            build/core-multi-memory-public.json

  explicit-core-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.4'
      - run: dart pub get
      - run: dart test -p node test/wasm_core_features_test.dart
      - run: dart test -p chrome test/wasm_core_features_test.dart
      - run: dart test -p node test/wasm_host_globals_test.dart
      - run: dart test -p chrome test/wasm_host_globals_test.dart

  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.4'
      - run: dart pub get
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only archives are reused; the installer checks their pinned hashes
          # before extracting fresh binaries on this runner.
          path: .toolchains/.downloads/*.tar.gz
          key: toolchain-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/toolchain.lock.json') }}
      - run: tool/ensure_toolchains.sh
      # DOOM tests require downloaded game assets and run separately.
      - run: python3 tool/test_toolchain_installer.py
      - run: dart test --exclude-tags=doom --reporter=expanded
