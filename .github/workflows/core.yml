name: Core interpreter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.11.0', '3.13.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only archives are reused; the installer checks their pinned hashes
          # before extracting fresh binaries on this runner.
          path: .toolchains/.downloads/*.tar.gz
          key: toolchain-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/toolchain.lock.json') }}
      - run: tool/ensure_toolchains.sh
      - run: dart analyze
      - run: dart analyze tool/core_spec_runner.dart
      - run: dart analyze tool/component_spec_runner.dart
      - run: dart analyze tool/wasi_testsuite_preview1_gate.dart
      - run: dart test test/wasm_core_features_test.dart
      - run: dart test test/wasm_host_globals_test.dart
      - run: dart test test/wasm_host_tags_test.dart
      - run: dart test test/wasm_exception_bridge_test.dart
      - run: dart test test/wasm_exception_test.dart
      - run: dart test test/wasm_import_keys_test.dart
      - run: dart run tool/spec_testsuite_runner.dart --suite=core --testsuite-dir=test/fixtures/import_keys --file=registry.wast --output-json=build/import-key-runner.json --output-md=build/import-key-runner.md
      - run: dart run tool/spec_testsuite_runner.dart --suite=core --testsuite-dir=test/fixtures/import_keys --file=registry.wast --prepare-manifest=build/import-key-manifest.json --prepare-root=build/import-key-input
      - run: dart compile js tool/spec_testsuite_player.dart -o build/import-key-player.js
      - run: node --import 'data:text/javascript,globalThis.WebAssembly=undefined' tool/run_spec_player_js.mjs build/import-key-player.js build/import-key-manifest.json build/import-key-player.json
      - run: dart run tool/core_multi_memory_public_runner.dart --output=build/core-multi-memory-public.json
      - run: dart test test/wasm_gc_element_globals_test.dart test/wasm_f64_const_test.dart test/wasm_f32_const_test.dart test/wasm_gc_v128_defaults_test.dart test/wasm_gc_array_test.dart test/wasm_async_tail_call_test.dart test/wasm_test.dart test/wasm_memory_test.dart test/wasm_table_test.dart test/wasm_predecode_test.dart test/wasi_preview3_async_runtime_test.dart test/wasi_preview3_task_return_runner_test.dart
      - run: dart run tool/core_spec_runner.dart --output-json=build/core.json --output-md=build/core.md
      - run: dart run tool/component_spec_runner.dart --output-json=build/component-values.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-${{ matrix.sdk }}
          path: |
            build/core.*
            build/component-values.json
            build/core-multi-memory-public.json
            build/import-key-runner.*
            build/import-key-player.json

  explicit-core-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.4'
      - run: dart pub get
      - run: dart test -p node test/wasm_core_features_test.dart
      - run: dart test -p chrome test/wasm_core_features_test.dart
      - run: dart test -p node test/wasm_host_globals_test.dart
      - run: dart test -p chrome test/wasm_host_globals_test.dart
      - run: dart test -p node test/wasm_exception_test.dart
      - run: dart test -p chrome test/wasm_exception_test.dart
      - run: dart test -p node test/component_test.dart
      - run: dart test -p chrome test/component_test.dart
      - run: dart test -p node test/wasi_component_wit_test.dart test/wasi_component_wit_adapter_runtime_test.dart test/wasi_component_adapter_plan_test.dart
      - run: dart test -p chrome test/wasi_component_wit_test.dart test/wasi_component_wit_adapter_runtime_test.dart test/wasi_component_adapter_plan_test.dart
      - run: dart test -p node test/wasi_test.dart
      - run: dart test -p chrome test/wasi_test.dart
      - run: >-
          dart test -p node -p chrome
          test/wasi_component_versioned_host_test.dart
          test/wasi_preview3_standard_wit_test.dart
          --name 'Preview3 (0[.]3[.][01] (executes|binds)|callback aliases|WIT plans reject)|resolves and caches both supported Preview3|keeps unsupported Preview3 version keys'

  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.4'
      - run: dart pub get
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only archives are reused; the installer checks their pinned hashes
          # before extracting fresh binaries on this runner.
          path: .toolchains/.downloads/*.tar.gz
          key: toolchain-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/toolchain.lock.json') }}
      - run: tool/ensure_toolchains.sh
      # DOOM tests require downloaded game assets and run separately.
      - run: python3 tool/test_toolchain_installer.py
      - run: dart test --exclude-tags=doom --reporter=expanded
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WebAssembly/wasi-testsuite
          ref: 6600796756adce3632409d7e207a9834c9d99ff8
          path: third_party/wasi-testsuite-source
          sparse-checkout: test-runner
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WebAssembly/wasi-testsuite
          ref: c63d52e69316d1aa2c9e7db6251892775204e7e0
          path: third_party/wasi-testsuite-fixtures
          sparse-checkout: |
            tests/rust/testsuite/wasm32-wasip3
            tests/assemblyscript/testsuite/wasm32-wasip1
            tests/c/testsuite/wasm32-wasip1
            tests/rust/testsuite/wasm32-wasip1
          persist-credentials: false
      - run: python3 -m venv build/wasi-testsuite-venv
      - run: 'build/wasi-testsuite-venv/bin/python -m pip install --only-binary=:all: -r third_party/wasi-testsuite-source/test-runner/requirements.txt'
      # Reuse native AOT code across all 45 fixture processes; keep the
      # adapter's existing 30-second per-fixture timeout.
      - name: Compile Preview3 runner (native AOT)
        run: dart compile exe tool/wasi_testsuite_preview3_component_runner.dart -o "$GITHUB_WORKSPACE/build/wasi-preview3-runner"
      - name: Run official Preview3 tests (native AOT)
        env:
          DART: dart
          WASD_PREVIEW3_RUNNER: "${{ github.workspace }}/build/wasi-preview3-runner"
        run: dart run tool/wasi_testsuite_preview3_runner.dart --testsuite-dir third_party/wasi-testsuite-fixtures --runner-dir third_party/wasi-testsuite-source/test-runner --python build/wasi-testsuite-venv/bin/python --json build/wasi-preview3.json --markdown build/wasi-preview3.md
      - name: Compile Preview1 runner (native AOT)
        run: dart compile exe tool/wasi_testsuite_preview1_runner.dart -o "$GITHUB_WORKSPACE/build/wasi-preview1-runner"
      - name: Run official Preview1 tests (native AOT)
        env:
          WASD_PREVIEW1_RUNNER: "${{ github.workspace }}/build/wasi-preview1-runner"
        run: dart run tool/wasi_testsuite_preview1_gate.dart --testsuite-dir third_party/wasi-testsuite-fixtures --runner-dir third_party/wasi-testsuite-source/test-runner --python build/wasi-testsuite-venv/bin/python --json build/wasi-preview1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wasi-preview1-native-${{ matrix.os }}
          path: build/wasi-preview1.json*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wasi-preview3-native-aot-${{ matrix.os }}
          path: build/wasi-preview3.*
